services:
  api:
    build:
      context: .
      dockerfile: src/MvpMakerApi.Api/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=db
      - DB_NAME=mvpmaker
      - DB_PASSWORD=password
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: mvpmaker
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword" ]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
